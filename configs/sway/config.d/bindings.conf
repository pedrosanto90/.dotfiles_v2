# Applications and session.
# @keybind sway|Help|Super+F1|Show the project keybindings
bindsym $mod+F1 exec ~/.local/bin/keybindings
# @keybind sway|Applications|Super+Enter|Open Ghostty
bindsym $mod+Return exec $term
# @keybind sway|Applications|Super+D|Open Wofi
bindsym $mod+d exec $menu
# @keybind sway|Applications|Super+B|Open Brave
bindsym $mod+b exec $browser
# @keybind sway|Applications|Super+E|Open Thunar
bindsym $mod+e exec $file_manager
# @keybind sway|Network|Super+Shift+N|Open the network and VPN editor
bindsym $mod+Shift+n exec nm-connection-editor
# @keybind sway|Displays|Super+Shift+M|Arrange and configure monitors graphically
bindsym $mod+Shift+m exec nwg-displays
# @keybind sway|Input|Super+Space|Switch keyboard layouts
bindsym $mod+space input type:keyboard xkb_switch_layout next
# @keybind sway|Windows|Super+Shift+Q|Close the focused window
bindsym $mod+Shift+q kill
# @keybind sway|Session|Super+Shift+C|Reload the Sway configuration
bindsym $mod+Shift+c reload
# @keybind sway|Session|Super+Shift+E|End the Sway session
bindsym $mod+Shift+e exec swaynag -t warning -m 'End the Sway session?' -b 'Exit' 'swaymsg exit'
# @keybind sway|Session|Super+Ctrl+L|Lock the session
bindsym $mod+Ctrl+l exec ~/.local/bin/sway-lock

# Focus and movement (hjkl or arrow keys).
# @keybind sway|Windows|Super+H/J/K/L or arrows|Move focus
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
# @keybind sway|Windows|Super+Shift+H/J/K/L or arrows|Move the focused window
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# Layout (Ctrl avoids conflicts with hjkl navigation and applications).
# @keybind sway|Layout|Super+Ctrl+H|Use a horizontal split
bindsym $mod+Ctrl+h splith
# @keybind sway|Layout|Super+Ctrl+V|Use a vertical split
bindsym $mod+Ctrl+v splitv
# @keybind sway|Layout|Super+S|Use stacking layout
bindsym $mod+s layout stacking
# @keybind sway|Layout|Super+W|Use tabbed layout
bindsym $mod+w layout tabbed
# @keybind sway|Layout|Super+A|Toggle split layout
bindsym $mod+a layout toggle split
# @keybind sway|Windows|Super+F|Toggle fullscreen
bindsym $mod+f fullscreen toggle
# @keybind sway|Windows|Super+Shift+Space|Toggle floating
bindsym $mod+Shift+space floating toggle
# @keybind sway|Windows|Super+Ctrl+Space|Switch tiled and floating focus
bindsym $mod+Ctrl+space focus mode_toggle
floating_modifier $mod normal

# Navigate physical monitors and move the current workspace between them.
# @keybind sway|Displays|Super+Ctrl+arrows|Focus the monitor in that direction
bindsym $mod+Ctrl+Left focus output left
bindsym $mod+Ctrl+Down focus output down
bindsym $mod+Ctrl+Up focus output up
bindsym $mod+Ctrl+Right focus output right
# @keybind sway|Displays|Super+Ctrl+Shift+arrows|Move the current workspace to that monitor
bindsym $mod+Ctrl+Shift+Left move workspace to output left
bindsym $mod+Ctrl+Shift+Down move workspace to output down
bindsym $mod+Ctrl+Shift+Up move workspace to output up
bindsym $mod+Ctrl+Shift+Right move workspace to output right

# Workspaces and moving windows between them.
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"
# @keybind sway|Workspaces|Super+1…0|Switch to workspace 1…10
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10
# @keybind sway|Workspaces|Super+Shift+1…0|Move the window to workspace 1…10
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# Workspace mode for the Colemak-DH upper letter row.
# @keybind sway|Workspace mode|Q/W/F/P/B/J/L/U/Y/;|Switch to workspace 1…10
# @keybind sway|Workspace mode|Shift+Q/W/F/P/B/J/L/U/Y/;|Move the window to workspace 1…10
mode "workspaces" {
    bindsym q workspace number $ws1, mode "default"
    bindsym w workspace number $ws2, mode "default"
    bindsym f workspace number $ws3, mode "default"
    bindsym p workspace number $ws4, mode "default"
    bindsym b workspace number $ws5, mode "default"
    bindsym j workspace number $ws6, mode "default"
    bindsym l workspace number $ws7, mode "default"
    bindsym u workspace number $ws8, mode "default"
    bindsym y workspace number $ws9, mode "default"
    bindsym semicolon workspace number $ws10, mode "default"
    bindsym Shift+q move container to workspace number $ws1, mode "default"
    bindsym Shift+w move container to workspace number $ws2, mode "default"
    bindsym Shift+f move container to workspace number $ws3, mode "default"
    bindsym Shift+p move container to workspace number $ws4, mode "default"
    bindsym Shift+b move container to workspace number $ws5, mode "default"
    bindsym Shift+j move container to workspace number $ws6, mode "default"
    bindsym Shift+l move container to workspace number $ws7, mode "default"
    bindsym Shift+u move container to workspace number $ws8, mode "default"
    bindsym Shift+y move container to workspace number $ws9, mode "default"
    bindsym Shift+semicolon move container to workspace number $ws10, mode "default"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
# @keybind sway|Workspace mode|Super+G|Enter workspace mode
bindsym $mod+g mode "workspaces"

# Scratchpad.
# @keybind sway|Scratchpad|Super+-|Show the scratchpad
bindsym $mod+minus scratchpad show
# @keybind sway|Scratchpad|Super+Shift+-|Move the window to the scratchpad
bindsym $mod+Shift+minus move scratchpad

# Screenshots: area, current output, and editor.
# @keybind sway|Screenshots|Print|Capture an area to the clipboard
bindsym Print exec ~/.local/bin/sway-screenshot area
# @keybind sway|Screenshots|Shift+Print|Capture the current output
bindsym Shift+Print exec ~/.local/bin/sway-screenshot output
# @keybind sway|Screenshots|Super+Print|Capture an area and open Swappy
bindsym $mod+Print exec ~/.local/bin/sway-screenshot edit

# PipeWire: audio and microphone through wpctl.
# @keybind sway|Media|Volume Up|Increase volume by 5%
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
# @keybind sway|Media|Volume Down|Decrease volume by 5%
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# @keybind sway|Media|Volume Mute|Toggle audio mute
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# @keybind sway|Media|Microphone Mute|Toggle microphone mute
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# @keybind sway|Media|Play/Pause|Toggle media playback
bindsym XF86AudioPlay exec playerctl play-pause
# @keybind sway|Media|Next Track|Play the next track
bindsym XF86AudioNext exec playerctl next
# @keybind sway|Media|Previous Track|Play the previous track
bindsym XF86AudioPrev exec playerctl previous
# @keybind sway|Media|Brightness Up|Increase brightness by 5%
bindsym XF86MonBrightnessUp exec brightnessctl set +5%
# @keybind sway|Media|Brightness Down|Decrease brightness by 5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# Resize mode.
# @keybind sway|Resize mode|H/J/K/L or arrows|Resize the focused window
# @keybind sway|Resize mode|Enter or Escape|Leave resize mode
mode "resize" {
    bindsym $left resize shrink width 10 px
    bindsym $down resize grow height 10 px
    bindsym $up resize shrink height 10 px
    bindsym $right resize grow width 10 px
    bindsym Left resize shrink width 10 px
    bindsym Down resize grow height 10 px
    bindsym Up resize shrink height 10 px
    bindsym Right resize grow width 10 px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
# @keybind sway|Resize mode|Super+R|Enter resize mode
bindsym $mod+r mode "resize"
