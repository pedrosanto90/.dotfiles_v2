# Discover input identifiers and names with: swaymsg -t get_inputs
# The first layout is the default. The keyboard helper reverses this order for
# splitkb Elora devices, so they start in Brazilian ABNT2 instead of US.
input type:keyboard {
    xkb_layout us,br
    xkb_variant ,abnt2
    xkb_options caps:escape
    repeat_delay 250
    repeat_rate 40
}

input type:touchpad {
    tap enabled
    natural_scroll disabled
    dwt enabled
}
