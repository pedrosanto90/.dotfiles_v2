# Modifier, applications, and Vim-style directions.
set $mod Mod4
set $term ghostty
set $menu wofi --show drun --allow-images
set $browser brave-browser --ozone-platform=wayland
set $file_manager thunar
set $left h
set $down j
set $up k
set $right l
set $wallpaper ~/.local/share/wallpapers/debian-sway-dev/tokyo-night.svg
