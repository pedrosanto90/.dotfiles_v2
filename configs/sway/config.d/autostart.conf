# Wayland environment for portals, Electron applications, and user systemd services.
exec_always dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec_always systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP

# --no-duplicate starts the Quickshell bar and allows Sway reloads.
exec_always ~/.local/bin/control-center start
exec mako
exec nm-applet --indicator
exec blueman-applet
exec udiskie --tray --automount --notify
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec /usr/bin/lxpolkit
exec ~/.local/bin/sway-keyboard-layout watch

# Maintain each workspace's selected tiling layout (alternating splits by default).
exec_always ~/.local/bin/sway-autotiling

# Arrange monitors and bind workspaces per the laptop / dual / triple setups.
exec_always ~/.local/bin/sway-displays watch

# Locking and power management; suspend is ignored on unsupported machines.
exec ~/.local/bin/sway-idle start
