# Monitor arrangement and workspace bindings are managed at runtime by
# `sway-displays watch`, which reacts to output plug/unplug events and applies
# the laptop / dual / triple layout. See `sway-displays status` for the plan in
# effect and the README "Display modes" section.
#
# nwg-displays (Super+Shift+M) remains available for ad-hoc mode, scale, and
# rotation tweaks; the next output event re-asserts the managed layout.
#
# Discover output names with: swaymsg -t get_outputs
# Manual fallback examples:
# output eDP-1 resolution 1920x1080 scale 1 position 0,0
# output DP-1 resolution 2560x1440@144Hz position 1920,0 adaptive_sync on
