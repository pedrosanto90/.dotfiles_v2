# List of plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0
set -g mouse on
set -g renumber-windows on

unbind C-b
# @keybind tmux|Session|Ctrl+J|Activate the tmux command prefix
set-option -g prefix C-j
# @keybind tmux|Session|Ctrl+J Ctrl+A|Send the tmux prefix to the application
bind-key C-a send-prefix
# Generated by theme-toggle from the active system palette.
source-file -q ~/.config/tmux/current-theme.conf

# @keybind tmux|Configuration|Ctrl+J R|Reload the tmux configuration
bind r source-file ~/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi

# QWERTY window selection, leaving the default numeric bindings available.
# @keybind tmux|Windows|Ctrl+J G|Enter window selection mode
bind g switch-client -T windows
# @keybind tmux|Windows|Ctrl+J G Q/W/E/R/T/Y/U/I/O/P|Select window 1…10
bind -T windows q select-window -t :=1
bind -T windows w select-window -t :=2
bind -T windows e select-window -t :=3
bind -T windows r select-window -t :=4
bind -T windows t select-window -t :=5
bind -T windows y select-window -t :=6
bind -T windows u select-window -t :=7
bind -T windows i select-window -t :=8
bind -T windows o select-window -t :=9
bind -T windows p select-window -t :=10
bind -T windows Enter switch-client -T root
bind -T windows Escape switch-client -T root

# Vim-like pane switching.
# @keybind tmux|Panes|Ctrl+J H/J/K/L|Move focus between panes
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# @keybind tmux|Sessions|Ctrl+J F|Open the tmux session selector
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-se"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf).
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' 'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
