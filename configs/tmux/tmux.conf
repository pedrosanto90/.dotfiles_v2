# List of plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0
set -g mouse on
set -g renumber-windows on

unbind C-b
# @keybind tmux|Session|Ctrl+J|Activate the tmux command prefix
set-option -g prefix C-j
# @keybind tmux|Session|Ctrl+J Ctrl+A|Send the tmux prefix to the application
bind-key C-a send-prefix
# Generated by theme-toggle from the active system palette.
source-file -q ~/.config/tmux/current-theme.conf

# @keybind tmux|Configuration|Ctrl+J R|Reload the tmux configuration
bind r source-file ~/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi

# Vim-like pane switching.
# @keybind tmux|Panes|Ctrl+J H/J/K/L|Move focus between panes
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# @keybind tmux|Sessions|Ctrl+J F|Open the tmux session selector
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-se"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf).
run '~/.tmux/plugins/tpm/tpm'
run-shell ~/clone/path/resurrect.tmux
