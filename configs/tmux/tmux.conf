# Accessible prefix and consistent terminal behavior.
unbind C-b
# @keybind tmux|Session|Ctrl+A|Activate the tmux command prefix
set -g prefix C-a
# @keybind tmux|Session|Ctrl+A Ctrl+A|Send Ctrl+A to the application
bind C-a send-prefix
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set -g status-style 'bg=#1a1b26,fg=#c0caf5'
set -g window-status-current-style 'bg=#7aa2f7,fg=#1a1b26,bold'
# @keybind tmux|Configuration|Ctrl+A R|Reload the tmux configuration
bind r source-file ~/.tmux.conf \; display-message 'tmux reloaded'
# @keybind tmux|Panes|Ctrl+A H/J/K/L|Move focus between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
