# Minimal Tokyo Night prompt.
palette = "tokyo_night"
add_newline = true
format = "$directory$git_branch$git_status$nodejs$python$golang$cmd_duration$line_break$character"

[palettes.tokyo_night]
background = "#1a1b26"
foreground = "#c0caf5"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
yellow = "#e0af68"
orange = "#ff9e64"
red = "#f7768e"
purple = "#bb9af7"
comment = "#565f89"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = " "
style = "purple"

[git_status]
style = "yellow"

[nodejs]
symbol = " "
style = "green"

[python]
symbol = " "
style = "yellow"

[golang]
symbol = " "
style = "cyan"

[cmd_duration]
min_time = 1000
format = "[$duration]($style) "
style = "comment"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"
